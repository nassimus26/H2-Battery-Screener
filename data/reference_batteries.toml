# Reference: lithium-ion batteries in current cars, for comparison in every view.
# These are liquid-electrolyte lithium-ion cells (not solid-state).
# Values are published measurements or market surveys; ranges where sources
# disagree. "quality" says how firm each figure is.

[[battery]]
name = "Tesla 4680 (NMC 811), cell"
level = "cell"
wh_kg = [232.5, 244.0]
wh_l = [622.4, 643.0]
cell_usd_kwh = [78.0, 104.7]
quality = "teardown measurements; cost is an analyst estimate"
sources = [
  "J. Electrochem. Soc. teardown of a 1st-gen 4680 cell: 232.5 Wh/kg, 622.4 Wh/L, doi:10.1149/1945-7111/ad14d0",
  "About:Energy measurement reported by Fastmarkets: ~243 Wh/kg, https://www.fastmarkets.com/insights/fastmarkets-cell-cost-reports-tesla-4680-cylindrical-october-2023/",
  "Notebookcheck: Model Y 4680 cell 244 Wh/kg, https://www.notebookcheck.net/Tesla-4680-vs-2170-battery-cell-test-reveals-lower-energy-density-in-the-Texas-made-Model-Y.669162.0.html",
  "Fastmarkets cell cost Oct 2023: 104.7 USD/kWh (US), 78 USD/kWh (China)",
]

